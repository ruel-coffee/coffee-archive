<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="ARKIVON 커피 추출 커뮤니티."><title>Community — ARKIVON</title><link rel="stylesheet" href="styles.css"><script src="app.js" defer></script></head>
<body data-page="community">
  <header class="site-header" data-header><a class="wordmark" href="index.html">ARKIVON</a><button class="menu-toggle" type="button" aria-expanded="false" aria-controls="main-nav">MENU</button><nav class="main-nav" id="main-nav"><a href="recipes.html">RECIPES</a><a href="lab.html">BREW LAB</a><a href="archive.html">ARCHIVE</a><a class="active" href="community.html">COMMUNITY</a></nav></header>
  <main>
    <section class="page-intro page-intro--row reveal"><div><p class="eyebrow">04 / OPEN TABLE</p><h1>추출 기록을 놓고<br>함께 답을 찾습니다.</h1></div><button class="button button--dark" type="button" data-open-composer>WRITE A POST</button></section>
    <section class="community-strip reveal"><p>추출 기록을 글에 첨부해 질문하세요.</p><p><span>●</span> OPEN DISCUSSION</p></section>
    <section class="post-feed" data-post-feed></section>
  </main>

  <dialog class="dialog" data-composer>
    <form class="dialog-panel post-form" data-post-form>
      <div class="dialog-head"><div><p class="section-label">NEW DISCUSSION</p><h2>기록에서 대화로</h2></div><button class="icon-button" type="button" data-close-dialog aria-label="닫기">×</button></div>
      <div class="form-grid">
        <label class="form-field"><span>WRITER</span><input name="author" required maxlength="20" placeholder="이름 또는 닉네임"></label>
        <label class="form-field"><span>ATTACH BREW RECORD</span><select name="brewId" data-brew-select><option value="">기록 없이 작성</option></select></label>
        <label class="form-field form-field--wide"><span>TITLE</span><input name="title" required maxlength="70" placeholder="무엇을 함께 이야기할까요?"></label>
        <label class="form-field form-field--wide"><span>BODY</span><textarea name="body" required rows="6" placeholder="시도한 방법과 궁금한 점을 구체적으로 적어주세요."></textarea></label>
      </div>
      <div class="form-actions"><button class="button button--dark" type="submit">PUBLISH</button><button class="button button--ghost" type="button" data-close-dialog>CANCEL</button></div>
    </form>
  </dialog>

  <dialog class="dialog" data-discussion><article class="dialog-panel discussion-panel" data-discussion-panel></article></dialog>
  <footer class="site-footer"><a class="wordmark" href="index.html">ARKIVON</a><p>One record.<br>Many perspectives.</p><a class="text-link" href="lab.html">RECORD A BREW →</a></footer>
</body>
</html>
